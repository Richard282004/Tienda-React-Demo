name: Backup de la base de datos

# DESACTIVADO (2026-09-23): este workflow subía un artifact de GitHub Actions
# con el volcado COMPLETO de la base (profiles, orders, order_messages,
# addresses — datos reales de clientas: nombre, correo, teléfono, dirección).
# Eso era seguro solo mientras el repo era privado. En un repo PÚBLICO, los
# artifacts de Actions son descargables por cualquier cuenta de GitHub, así
# que este workflow filtraría esos datos apenas corriera.
#
# Alternativa recomendada (no toca GitHub en absoluto): activar los backups
# automáticos nativos de Supabase (Project Settings -> Database -> Backups),
# o adaptar scripts/backup-rest.mjs para subir a un storage privado propio
# (ej. un bucket R2 con acceso restringido) en vez de a un artifact.
on:
  workflow_dispatch: {}

jobs:
  dump:
    if: false # ver nota arriba — no reactivar sin cambiar el destino del backup
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Exportar tablas a JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-rest.mjs

      - name: Comprimir
        run: |
          cd backup && tar -czf ../supabase-backup.tar.gz * && cd ..
          ls -lh supabase-backup.tar.gz

      # NO reactivar este paso en un repo público: el artifact quedaría
      # descargable por cualquiera. Cambiar a un storage privado primero.
      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: supabase-backup.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Avisar por Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="💾 MILUÉ LOOP: backup de la base OK (artifact 'supabase-backup')."
          else
            MSG="⚠️ MILUÉ LOOP: el backup diario de la base FALLÓ. Revisa el workflow en GitHub."
          fi
          curl -sS --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true
