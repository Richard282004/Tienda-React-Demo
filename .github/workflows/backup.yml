name: Backup de la base de datos

# Copia diaria de los datos de Supabase, vía la API REST (sin pg_dump, sin
# contraseña de la base). El esquema (tablas, funciones, políticas) ya vive en
# supabase/schema.sql; esto respalda el CONTENIDO. Se sube como artifact
# privado del workflow (90 días), NO se commitea al repo.
#
# Requiere 2 secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL                = https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   = Supabase -> Project Settings -> API ->
#                                 "service_role" secret (empieza con eyJ...)
on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC (~02:17 Chile) todos los días
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Exportar tablas a JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-rest.mjs

      - name: Comprimir
        run: |
          cd backup && tar -czf ../supabase-backup.tar.gz * && cd ..
          ls -lh supabase-backup.tar.gz

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: supabase-backup.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Avisar por Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="💾 MILUÉ LOOP: backup de la base OK (artifact 'supabase-backup')."
          else
            MSG="⚠️ MILUÉ LOOP: el backup diario de la base FALLÓ. Revisa el workflow en GitHub."
          fi
          curl -sS --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true
