name: Health check

# Monitorea la tienda en producción. Si /api/health o la portada fallan:
#  - abre (o comenta) un issue con label "monitor"; lo cierra cuando vuelve
#  - avisa por Telegram (secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID)
#  - opcional: webhook Slack/Discord (secret ALERT_WEBHOOK_URL)
on:
  schedule:
    - cron: '*/15 * * * *' # cada 15 minutos
  workflow_dispatch: {}

permissions:
  issues: write

concurrency:
  group: healthcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://tienda-react-demo.richardlagos2.workers.dev' }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Probar /api/health y la portada
        id: probe
        run: |
          set +e
          fail=""

          health_code=$(curl -sS -A "MilueLoop-Monitor" -o /tmp/health.json -w '%{http_code}' --max-time 20 "$SITE_URL/api/health")
          echo "health: $health_code $(cat /tmp/health.json)"
          [ "$health_code" = "200" ] || fail="$fail health($health_code)"

          home_code=$(curl -sS -A "MilueLoop-Monitor" -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/")
          echo "home: $home_code"
          [ "$home_code" = "200" ] || fail="$fail home($home_code)"

          if [ -n "$fail" ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "detail=$fail" >> "$GITHUB_OUTPUT"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir / cerrar issue según el estado
        id: issue
        uses: actions/github-script@v7
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
          PROBE_DETAIL: ${{ steps.probe.outputs.detail }}
        with:
          script: |
            const status = process.env.PROBE_STATUS;
            const detail = process.env.PROBE_DETAIL || '';
            const title = 'Tienda caída (health check)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'monitor',
            });
            const open = issues.find(i => i.title === title);

            if (status === 'down') {
              const body = `El chequeo automático falló: \`${detail}\`\n\nHora: ${new Date().toISOString()}`;
              if (open) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, body });
                core.setOutput('event', 'still-down');
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['monitor'] });
                core.setOutput('event', 'went-down');
              }
            } else if (open) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, body: `Recuperada ✅ ${new Date().toISOString()}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, state: 'closed' });
              core.setOutput('event', 'recovered');
            } else {
              core.setOutput('event', 'ok');
            }

      - name: Avisar por Telegram y webhook
        if: steps.issue.outputs.event == 'went-down' || steps.issue.outputs.event == 'recovered'
        env:
          EVENT: ${{ steps.issue.outputs.event }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          if [ "$EVENT" = "recovered" ]; then
            MSG="✅ MILUÉ LOOP: la tienda volvió a responder — $SITE_URL"
          else
            MSG="🔴 MILUÉ LOOP: tienda caída ($DETAIL) — $SITE_URL"
          fi

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              --data "disable_web_page_preview=true" || true
          fi

          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -sS --max-time 15 -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\"${MSG}\"}" "$ALERT_WEBHOOK_URL" || true
          fi
